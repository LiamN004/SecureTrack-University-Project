{% extends 'base.html' %}{% block title %}Register | SecureTrack{% endblock %}{% block content %}
<div class="auth-card"><h1>Create account</h1><p>The first account created becomes the prototype administrator.</p>
<form method="post"><div class="form-grid"><div><label>First name *</label><input name="first_name" required maxlength="80"></div><div><label>Last name *</label><input name="last_name" required maxlength="80"></div></div><label>Username *</label><input name="username" minlength="3" maxlength="80" required><label>Password *</label><input type="password" name="password" minlength="8" required><label>Confirm password *</label><input type="password" name="confirm_password" minlength="8" required><button class="btn primary" type="submit">Create account</button></form>
<p class="muted">Already registered? <a href="{{ url_for('login') }}">Sign in</a></p></div>{% endblock %}
