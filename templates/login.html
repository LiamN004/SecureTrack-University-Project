{% extends 'base.html' %}{% block title %}Login | SecureTrack{% endblock %}{% block content %}
<div class="auth-card"><h1>Welcome back</h1><p>Sign in to manage security incidents and vulnerabilities.</p>
<form method="post"><label>Username</label><input name="username" required autocomplete="username"><label>Password</label><input type="password" name="password" required autocomplete="current-password"><button class="btn primary" type="submit">Sign in</button></form>
<p class="muted">No account? <a href="{{ url_for('register') }}">Register</a></p></div>{% endblock %}
