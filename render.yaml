services:
  - type: web
    name: securetrack
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    healthCheckPath: /health
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: securetrack-db
          property: connectionString

databases:
  - name: securetrack-db
    databaseName: securetrack
    user: securetrack
